<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Курс на B2</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Onest:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <a class="brand" href="#home"><span class="logo">B2</span><span><b>Курс на B2</b><small>английский с нуля</small></span></a>
    <nav id="nav" aria-label="Разделы">
      <a href="#home" data-r="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>Сегодня</a>
      <a href="#course" data-r="course"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><path d="M8.2 18H14a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h5.8"/></svg>Курс</a>
      <a href="#words" data-r="words"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6.5" width="13" height="14" rx="2.5"/><path d="M8 3.5h10A2.5 2.5 0 0 1 20.5 6v11"/></svg>Слова</a>
      <a href="#tutor" data-r="tutor"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h16v11H9.5L5 20v-3.5H4z"/></svg>Тьютор</a>
      <a href="#video" data-r="video"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10.5 9.5 4 2.5-4 2.5z" fill="currentColor"/></svg>Видео</a>
      <a href="#plan" data-r="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4.5h12l-2.5 4 2.5 4H5"/></svg>План</a>
      <a href="#settings" data-r="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Настройки</a>
    </nav>
    <div class="side-foot">
      <div id="side-stats" class="side-stats"></div>
      <p id="sync" class="sync">Запускаю…</p>
    </div>
  </aside>
  <main class="main"><div id="view" class="view"></div></main>
</div>

<button id="fab" class="fab" type="button" data-act="dr-open"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>Спросить ИИ</button>
<aside id="drawer" class="drawer" hidden aria-label="Вопрос к ИИ">
  <header><div><b>Спросить ИИ</b><span id="dr-ctx"></span></div><button class="icon-btn" type="button" data-act="dr-close" aria-label="Закрыть"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
  <div id="dr-chat" class="chatbox"></div>
</aside>

<script src="/static/content/base.js"></script>
<script src="/static/core.js"></script>
<script src="/static/speech.js"></script>
<script src="/static/ai.js"></script>
<script src="/static/content/lessons-1.js"></script>
<script src="/static/content/lessons-2.js"></script>
<script src="/static/lesson.js"></script>
<script src="/static/views.js"></script>
</body>
</html>
